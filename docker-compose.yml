version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    networks:
      - lab-network

  app:
    build: .
    container_name: spring_app
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: clave_super_segura_12345678901234567890
    depends_on:
      - mysql
    restart: on-failure
    networks:
      - lab-network

networks:
  lab-network: